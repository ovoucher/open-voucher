[package]
name = "redeem_pool"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Open Voucher redemption pool: burns a merchant's vouchers through SAC clawback and pays USDC 1:1 from an agency float, queueing shortfalls FIFO"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
merchant_registry = { path = "../merchant_registry" }
